services:
  mysql:
    image: mysql:8
    container_name: enfos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enfos_reporting}
      MYSQL_USER: ${MYSQL_USER:-enfos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enfos}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-enfos}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-enfos}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: enfos-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-enfos_reporting}
      DB_USERNAME: ${MYSQL_USER:-enfos}
      DB_PASSWORD: ${MYSQL_PASSWORD:-enfos}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: enfos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql_data:
    name: enfos_mysql_data
